name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-publish:
    name: Lint, Test, Publish & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Step 1 - Static Code Analysis (Detekt & Android Lint)
        run: ./gradlew openf1-sdk:detekt openf1-sdk:lintRelease

      - name: Step 2 - Unit Tests
        run: ./gradlew openf1-sdk:jvmTest

      - name: Step 3 - Verify Maven Local Publication
        run: ./gradlew openf1-sdk:publishToMavenLocal

      - name: Step 4 - Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
